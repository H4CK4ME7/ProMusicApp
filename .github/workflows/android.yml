name: Android CI

on:
  push:
    branches: [ "main" ] # main branch ထဲ Code ရောက်တာနဲ့ အလုပ်စလုပ်ခိုင်းတာပါ

jobs:
  build:
    runs-on: ubuntu-latest # GitHub ရဲ့ Linux Server ပေါ်မှာ Build လုပ်မှာပါ

    steps:
    - uses: actions/checkout@v3 # ကိုယ့် Code တွေကို Server ပေါ် ဆွဲတင်တာပါ

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build with Gradle
      run: ./gradlew assembleDebug # ဒီနေရာမှာ APK ကို စတင်ထုတ်လုပ်တာပါ

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: ProMusic-APK # ထွက်လာမယ့် ဖိုင်နာမည်ပါ
        path: app/build/outputs/apk/debug/app-debug.apk
